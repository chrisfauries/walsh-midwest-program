<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walsh Honor Band — Midwest Program</title>
<meta name="theme-color" content="#0d1f16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0d1f16; --gold: #fbbf24; --cream: #fbf6ea; --text: #ffffff;
    --serif: "Instrument Serif", Georgia, serif; --sans: "Manrope", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; background: var(--night); }
  body { margin: 0; color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; background: var(--night); }
  img { display: block; }
  .ph { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: var(--gold); color: #1a1300; padding: 2px 6px; border-radius: 3px; vertical-align: middle; }

  .slide { position: relative; min-height: 100svh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: flex-end; padding: calc(28px + env(safe-area-inset-top)) 24px calc(34px + env(safe-area-inset-bottom)); overflow: hidden; isolation: isolate; }
  .slide > .in { position: relative; z-index: 2; max-width: 520px; width: 100%; margin: 0 auto; }
  .bgimg { position: absolute; inset: 0; z-index: 0; }
  .bgimg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
  .bgimg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 25%, rgba(0,0,0,.82) 78%); }
  .k { font-size: 11px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
  .serif { font-family: var(--serif); font-weight: 400; }

  /* Cover */
  .cover { justify-content: space-between; background: radial-gradient(120% 70% at 50% 100%, #1f5235 0%, var(--night) 70%); }
  .cover .topline { display: flex; justify-content: space-between; padding-left: 34px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; position: relative; z-index: 2; }
  .cover h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(64px, 21vw, 120px); line-height: .86; margin: 0; letter-spacing: -.02em; }
  .cover h1 i { color: var(--gold); }
  .cover .info { margin-top: 22px; display: grid; gap: 4px; font-size: 15px; }
  .cover .info b { font-weight: 800; }
  .rings { position: absolute; left: 50%; top: 38%; width: 160vmax; height: 160vmax; transform: translate(-50%, -50%); z-index: 0; background: repeating-radial-gradient(circle, transparent 0 38px, rgba(251,191,36,.06) 38px 39px); }
  .swipe { display: flex; align-items: center; gap: 10px; margin-top: 28px; font-size: 13px; font-weight: 700; opacity: .75; }
  .swipe span { width: 26px; height: 40px; border: 2px solid currentColor; border-radius: 14px; position: relative; }
  .swipe span::after { content: ""; position: absolute; left: 50%; top: 7px; width: 4px; height: 8px; margin-left: -2px; background: var(--gold); border-radius: 2px; animation: sc 1.6s infinite; }
  @keyframes sc { 60% { transform: translateY(12px); opacity: 0; } }

  /* Welcome */
  .welcome { background: var(--cream); color: #13261b; justify-content: center; }
  .welcome .k { color: #8a6400; }
  .welcome h2 { font-family: var(--serif); font-size: 52px; line-height: .95; margin: 10px 0 18px; font-weight: 400; }
  .welcome p { font-size: 17px; line-height: 1.6; }
  .welcome .sig { font-family: var(--serif); font-size: 22px; font-style: italic; }

  /* Program overview */
  .overview { background: var(--night); justify-content: center; }
  .overview h2 { font-family: var(--serif); font-size: 56px; font-weight: 400; margin: 6px 0 16px; line-height: .9; }
  .overview ol { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  .overview a { display: flex; gap: 14px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.1); text-decoration: none; color: inherit; }
  .overview a::before { counter-increment: n; content: counter(n, decimal-leading-zero); font-size: 12px; font-weight: 800; color: var(--gold); width: 20px; flex: none; }
  .overview a b { font-family: var(--serif); font-weight: 400; font-size: 22px; line-height: 1.1; }
  .overview a small { display: block; font-size: 12px; opacity: .6; margin-top: 2px; }

  /* Piece slide */
  .piece { background: var(--c1); }
  .piece::before { content: ""; position: absolute; inset: 0; z-index: 0; background: radial-gradient(90% 60% at 80% 10%, var(--c2), transparent 70%), radial-gradient(80% 50% at 0% 100%, rgba(0,0,0,.45), transparent 70%); }
  .piece .bign { position: absolute; z-index: 1; top: calc(10px + env(safe-area-inset-top)); right: 6px; font-family: var(--serif); font-size: 46vh; line-height: .8; color: rgba(255,255,255,.08); letter-spacing: -.04em; pointer-events: none; }
  .piece .cimg { width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); margin-bottom: 18px; object-fit: cover; }
  .piece h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(46px, 14vw, 72px); line-height: .92; margin: 8px 0 10px; letter-spacing: -.01em; }
  .piece .by { font-size: 16px; font-weight: 700; }
  .piece .by span { opacity: .65; font-weight: 500; }
  .piece .teaser { font-size: 16px; line-height: 1.55; opacity: .88; margin: 16px 0 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .more { margin-top: 20px; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #111; border: 0; border-radius: 999px; padding: 13px 20px; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; }

  /* Band slide */
  .band { background: radial-gradient(120% 60% at 50% 30%, #1f5235, var(--night) 75%); justify-content: center; }
  .pan { overflow-x: auto; margin: 22px -24px 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .pan::-webkit-scrollbar { display: none; }
  .pan img { height: min(46svh, 420px); width: auto; max-width: none; display: block; }
  .panhint { font-size: 12px; font-weight: 700; opacity: .6; letter-spacing: .06em; }
  .sgrid button { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  .ov .biolink { font-weight: 800; color: #13261b; }
  .band h2 { font-family: var(--serif); font-weight: 400; font-size: 60px; line-height: .9; margin: 8px 0 8px; }
  .band p { margin: 0; opacity: .8; }

  /* Roster slides */
  .roster { background: linear-gradient(180deg, #102a1c, var(--night)); justify-content: center; }
  .roster h2 { font-family: var(--serif); font-weight: 400; font-size: 48px; line-height: .95; margin: 6px 0 4px; }
  .roster .sub { font-size: 13px; opacity: .6; margin-bottom: 18px; }
  .fam { margin-top: 14px; }
  .fam h3 { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 8px; color: var(--gold); }
  .faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
  .faces button { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; text-align: center; }
  .faces img { width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; border: 2px solid rgba(251,191,36,.35); }
  /* tie & sash colors */
  .sash { height: 5px; width: 150px; border-radius: 3px; margin: 18px 0 0; }
  .fam h3 { display: flex; align-items: center; gap: 8px; color: #fff; }
  .fam h3::before { content: ""; width: 16px; height: 4px; border-radius: 2px; background: var(--c); }
  .faces img.tie { border-color: var(--c); }
  .candid { background: var(--night); justify-content: flex-end; }
  .candid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
  .candid::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,31,22,.0) 45%, rgba(13,31,22,.92) 88%); }
  .candid .in { position: relative; z-index: 1; }
  .candid h2 { font-family: var(--serif); font-weight: 400; font-size: 52px; line-height: .9; margin: 8px 0 0; }
  .secview { justify-content: center; }
  .secview .blur { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) brightness(.32) saturate(1.2); z-index: -1; }
  .secview .shot { width: calc(100% + 48px); max-width: none; height: auto; margin: 10px -24px 0; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .secview h2 { font-family: var(--serif); font-weight: 400; font-size: 48px; line-height: .9; margin: 18px 0 14px; display: flex; align-items: center; gap: 12px; }
  .secview h2::after { content: ""; flex: none; width: 36px; height: 4px; border-radius: 2px; background: var(--c); }
  .strip { display: flex; align-items: flex-start; gap: 12px; overflow-x: auto; margin: 0 -24px; padding: 2px 24px 6px; scroll-snap-type: x proximity; scroll-padding-inline: 24px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .strip::-webkit-scrollbar { display: none; }
  .strip button { flex: none; width: 82px; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; text-align: center; scroll-snap-align: start; }
  .strip img { width: 82px; height: 82px; border-radius: 50%; object-fit: cover; border: 2.5px solid var(--c); }
  .strip span { display: block; font-size: 12px; line-height: 1.15; margin-top: 6px; font-weight: 600; }
  .strip small { display: block; font-size: 10px; opacity: .6; margin-top: 2px; }
  .strip .rl { flex: none; scroll-snap-align: start; align-self: stretch; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; opacity: .55; text-align: center; padding: 0 2px; height: 82px; border-left: 1px solid rgba(255,255,255,.3); }
  .strip .rl ~ .rl { margin-left: 8px; }
  .striphint { font-size: 11.5px; opacity: .55; margin-top: 8px; }
  .faces span { display: block; font-size: 11.5px; line-height: 1.15; margin-top: 5px; font-weight: 600; }

  /* Director slide */
  .director h2 { font-family: var(--serif); font-weight: 400; font-size: 58px; line-height: .9; margin: 8px 0 6px; }
  .director .role { font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .director .t { font-size: 13px; opacity: .7; margin-top: 2px; }
  .director q { display: block; font-family: var(--serif); font-size: 24px; line-height: 1.2; margin-top: 16px; font-style: italic; }

  .staff { background: var(--cream); color: #13261b; justify-content: center; }
  .staff .k { color: #8a6400; }
  .staff h2 { font-family: var(--serif); font-weight: 400; font-size: 46px; line-height: .95; margin: 6px 0 16px; }
  .sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px; }
  .sgrid img { width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; object-position: 50% 20%; }
  .sgrid b { display: block; font-size: 11px; line-height: 1.15; margin-top: 5px; text-align: center; }
  .sgrid small { display: block; font-size: 10px; text-align: center; color: #6b5a2a; }

  .about { background: var(--cream); color: #13261b; justify-content: center; }
  .about .k { color: #8a6400; }
  .about h2 { font-family: var(--serif); font-weight: 400; font-size: 46px; line-height: .95; margin: 6px 0 16px; }
  .about p { font-size: 16px; line-height: 1.6; margin: 0 0 12px; }
  .thanks { background: radial-gradient(120% 60% at 50% 0%, #1f5235, var(--night) 75%); justify-content: center; }
  .thanks .qphoto { width: calc(100% + 48px); max-width: none; height: auto; margin: 14px -24px 0; }
  .thanks .qcap { font-size: 12px; opacity: .6; margin-top: 8px; }
  .qletter { background: var(--cream); color: #13261b; border-radius: 6px; padding: 20px 18px 8px; margin-top: 18px; border-top: 4px solid var(--gold); }
  .qletter h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1; margin: 0 0 10px; }
  .qletter p { font-family: var(--serif); font-size: 18px; line-height: 1.45; margin: 0 0 10px; }
  .qletter .sig { font-style: italic; opacity: .7; }
  .finale { background: radial-gradient(100% 60% at 50% 0%, #2a6b45, var(--night) 70%); justify-content: center; text-align: center; }
  .finale p { font-size: 16px; line-height: 1.6; opacity: .85; }
  .finale .motto { font-family: var(--serif); font-size: 44px; line-height: .98; margin: 24px 0; opacity: 1; }
  .finale .motto i { color: var(--gold); }
  .finale a.cta { display: inline-block; background: var(--gold); color: #1a1300; text-decoration: none; font-weight: 800; border-radius: 999px; padding: 15px 26px; }
  .finale small { display: block; margin-top: 22px; opacity: .5; font-size: 12px; }
  .finale small a { color: inherit; }

  /* progress */
  .prog { position: fixed; right: 8px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 5px; filter: drop-shadow(0 0 2px rgba(0,0,0,.5)); }
  .prog i { width: 4px; height: 4px; border-radius: 2px; background: #fff; opacity: .45; transition: height .25s, opacity .25s; }
  .prog i.on { height: 16px; opacity: 1; }
  /* hamburger + slide-out contents panel */
  .menu-btn { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; z-index: 60; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(10,20,14,.62); color: #fff; border: 1px solid rgba(255,255,255,.3); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); cursor: pointer; padding: 0; }
  .menu-btn svg { width: 16px; height: 16px; }
  .scrim { position: fixed; inset: 0; z-index: 58; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .menu { position: fixed; top: 0; bottom: 0; left: 0; z-index: 59; width: min(82vw, 320px); background: #0b1a12; border-right: 1px solid rgba(251,191,36,.18); transform: translateX(-102%); transition: transform .32s cubic-bezier(.2,.8,.2,1); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  body.menu-open .menu { transform: none; box-shadow: 20px 0 60px rgba(0,0,0,.5); }
  body.menu-open .scrim { opacity: 1; pointer-events: auto; }
  .menu-in { padding: calc(60px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom)); }
  .menu .brand { font-family: var(--serif); font-size: 30px; line-height: 1; margin: 0 0 4px; }
  .menu .brand i { color: var(--gold); }
  .menu .sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .55; margin-bottom: 18px; }
  .menu ul { list-style: none; margin: 0; padding: 0; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: #fff; font: inherit; cursor: pointer; border-radius: 8px; }
  .menu .top { font-size: 15px; font-weight: 800; padding: 10px 8px; margin-top: 4px; }
  .menu .child { font-size: 14px; padding: 7px 8px 7px 30px; opacity: .78; }
  .menu button.cur { background: rgba(251,191,36,.14); opacity: 1; color: var(--gold); }
  .menu button:active { background: rgba(255,255,255,.08); }
  .menu .no { width: 20px; font-size: 11px; font-weight: 700; color: var(--gold); flex: none; margin-left: -2px; }
  .menu .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 6px 0 4px; }
  /* review back button moves to the top-right in this draft (hamburger takes the left) */
  body .review-back { left: auto; right: 8px; }
  body.menu-open .review-back, body.lock .review-back { display: none; }
  .cover .topline { padding-right: 36px; }

  /* overlay */
  .ov { position: fixed; inset: 0; z-index: 50; background: var(--cream); color: #13261b; transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.8,.2,1); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ov.on { transform: none; }
  .ov .head { position: relative; padding: calc(60px + env(safe-area-inset-top)) 24px 26px; color: #fff; background: var(--c1, var(--night)); }
  .ov .head h2 { font-family: var(--serif); font-weight: 400; font-size: 48px; line-height: .95; margin: 8px 0 6px; }
  .ov .x { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; font-size: 22px; z-index: 2; cursor: pointer; backdrop-filter: blur(8px); }
  .ov .body { padding: 8px 24px 60px; max-width: 560px; margin: 0 auto; }
  .ov h4 { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #8a6400; margin: 28px 0 8px; }
  .ov p { font-size: 17px; line-height: 1.6; margin: 0 0 12px; }
  .ov .comp { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
  .ov .comp img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
  .ov .comp b { font-family: var(--serif); font-size: 26px; font-weight: 400; }
  .ov blockquote { margin: 0; font-family: var(--serif); font-size: 26px; line-height: 1.25; font-style: italic; border-left: 3px solid var(--gold); padding-left: 16px; }
  .ov .pimg { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: 50% 18%; border-radius: 20px; margin-top: 12px; }
  body.lock { overflow: hidden; }
</style>
</head>
<body>
<div id="deck"></div>
<div class="prog" id="prog" aria-hidden="true"></div>
<button class="menu-btn" id="menuBtn" aria-label="Open contents" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
<div class="scrim" id="scrim"></div>
<nav class="menu" id="menu" aria-label="Contents"><div class="menu-in" id="menuIn"></div></nav>
<div class="ov" id="ov" role="dialog" aria-modal="true"><button class="x" id="x" aria-label="Close">×</button><div id="ovc"></div></div>

<script src="../shared/program-data.js"></script>
<script src="../shared/placeholders.js"></script>
<script src="../shared/review-nav.js"></script>
<script>
(() => {
  const P = window.PROGRAM, U = window.PROGRAM_UTIL, e = U.esc, c = P.concert;
  const PAL = { bg1: "#2a5a3e", bg2: "#10281a", fg: "#fbbf24", body: "#06140c" };
  const COLORS = [ // one mood per piece
    ["#c2410c", "#fb923c"], ["#1e1b4b", "#6d28d9"], ["#0f766e", "#5eead4"], ["#365314", "#a3e635"], ["#7c2d12", "#fbbf24"],
    ["#0c4a6e", "#38bdf8"], ["#0b1027", "#3b5bdb"], ["#9d174d", "#f472b6"], ["#163825", "#fbbf24"], ["#b45309", "#fde047"],
  ];
  const nn = i => String(i + 1).padStart(2, "0");
  const total = P.sections.reduce((a, s) => a + s.players.length, 0);
  const slides = [];

  slides.push(`<section class="slide cover" data-chip="0">
    <div class="rings"></div>
    <div class="topline"><span>${e(c.event.replace("The ", ""))}</span><span>Chicago</span></div>
    <div class="in">
      <div class="k">${e(c.school)} presents</div>
      <h1>Walsh<br><i>Honor</i><br>Band</h1>
      <div class="sash" style="background:${U.stripe()}" aria-hidden="true"></div>
      <div class="info"><span><b>${e(c.date)}</b> · ${e(c.time)}</span><span>${e(c.venue)} · ${e(c.room)}</span><span>Conducted by <b>${e(c.conductor)}</b></span></div>
      <div class="swipe"><span></span>Swipe up for the program</div>
    </div></section>`);

  slides.push(`<section class="slide band"><div class="in">
    <div class="k">The Ensemble</div><h2>${total} musicians.<br><i>One band.</i></h2>
    <div class="pan" id="pan"><img alt="${e(P.bandPhoto.caption)}" src="${PH.band()}"></div>
    <div class="panhint">← swipe to see everyone →</div><p style="margin-top:6px">${e(P.bandPhoto.caption)}</p></div></section>`);

  slides.push(`<section class="slide overview"><div class="in">
    <div class="k">Tonight</div><h2>The Program</h2>
    <ol>${P.pieces.map((p, i) => `<li><a href="#piece-${i + 1}"><span><b>${e(p.title)}</b><small>${e(p.composer)}</small></span></a></li>`).join("")}</ol></div></section>`);

  P.pieces.forEach((p, i) => {
    const [c1, c2] = COLORS[i % COLORS.length];
    slides.push(`<section class="slide piece" id="piece-${i + 1}" style="--c1:${c1};--c2:${c2}">
      <div class="bign">${nn(i)}</div>
      <div class="in">
        <img class="cimg" alt="" src="${PH.photoFor({ name: p.composer, photo: p.composerPhoto }, { bg1: c2, bg2: c1, fg: "#fff", body: "rgba(0,0,0,.4)" })}">
        <div class="k" style="color:#fff;opacity:.75">${nn(i)} / ${nn(P.pieces.length - 1)}</div>
        <h2>${e(p.title)}</h2>
        <div class="by">${e(p.composer)} <span>${p.duration ? " · " + e(p.duration) : ""}</span></div>
        <p class="teaser">${e(p.description)}</p>
        <button class="more" data-piece="${i}">Read the story ↑</button>
      </div></section>`);
  });

  // Personnel: one page per section photo — photo on top, then one swipeable row of faces in photo order
  P.sectionPhotos.forEach(g => {
    slides.push(`<section class="slide secview" style="--c:${U.color(g.instruments[0])}">
      <img class="blur" alt="" loading="lazy" src="${PH.section(g)}">
      <div class="in">
        <div class="k">Meet the Musicians</div>
        <img class="shot" alt="${e(g.title)} section photo" loading="lazy" src="${PH.section(g)}">
        <h2>${e(g.title)}</h2>
        <div class="strip">${g.rows.map(([row, names]) => `${row ? `<span class="rl">${e(row)}</span>` : ""}${names.map(n => { const inst = U.instrumentOf(n), st = U.student(n, inst); return `<button data-student="${e(n)}" data-inst="${e(inst)}"><img alt="" loading="lazy" src="${PH.photoFor(st, PAL, { fontSize: 40, initialsY: 100 })}"><span>${e(n)}</span></button>`; }).join("")}`).join("")}</div>
        <div class="striphint">Tap a face to meet them${U.photoOrder(g).length > 3 ? " · swipe for more →" : ""}</div>
      </div></section>`);
  });

  P.directors.forEach((d, i) => {
    slides.push(`<section class="slide director"><div class="bgimg"><img alt="${e(d.name)}" src="${PH.photoFor(d, PAL)}"></div>
      <div class="in"><div class="k">${i === 0 ? "Conductor" : "Directors"}</div><h2>${e(d.name)}</h2><div class="role">${e(d.role)}</div><div class="t">${e(d.teaches || "")}</div>
      <q>${e(d.quote)}</q><button class="more" data-director="${i}">Read bio ↑</button></div></section>`);
  });

  slides.push(`<section class="slide staff"><div class="in">
    <div class="k">Private Lesson Staff</div><h2>The teachers behind every section</h2>
    <div class="sgrid">${P.lessonStaff.map((t, i) => `<button data-staff="${i}"><img alt="" loading="lazy" src="${PH.photoFor(t, { bg1: "#efe6d2", bg2: "#d8c9a6", fg: "#163825", body: "#a77a12" }, { fontSize: 40, initialsY: 100 })}"><b>${e(t.name)}</b><small>${e(t.instrument)}</small></button>`).join("")}</div>
    <p style="font-size:12px;margin-top:10px;opacity:.6">Tap a teacher for their bio</p>
  </div></section>`);

  slides.push(`<section class="slide about"><div class="in">
    <div class="k">Our Program</div><h2>${e(P.aboutProgram.heading)}</h2>
    ${P.aboutProgram.placeholder ? '<span class="ph">draft</span>' : ""}${U.paras(P.aboutProgram.body)}
  </div></section>`);

  slides.push(`<section class="slide thanks"><div class="in">
    <div class="k">Thank You</div>
    <img class="qphoto" alt="${e(P.qualifyingBand.caption)}" loading="lazy" src="${(window.ASSET_ROOT || "../") + P.qualifyingBand.photo}">
    <div class="qcap">${e(P.qualifyingBand.caption)}</div>
    <article class="qletter"><h2>${e(P.qualifyingBand.letterHeading)}</h2>${P.qualifyingBand.placeholder ? '<span class="ph">draft</span>' : ""}
      ${U.paras(P.qualifyingBand.letter)}<p class="sig">${e(P.qualifyingBand.signedBy)}</p></article>
  </div></section>`);

  slides.push(`<section class="slide finale"><div class="in">
    <div class="k">With Gratitude</div><p>${e(P.thanks)}</p>
    <p style="font-size:13px;margin-top:16px">${P.administration.map(a => `<b>${e(a.name)}</b>, ${e(a.role)}`).join("<br>")}</p>
    <p class="motto">The way we do <i>anything</i> is the way we do <i>everything.</i></p>
    <small>${e(c.school)} · ${e(c.district)} · <a href="${e(c.siteUrl)}">walshband.com</a></small>
  </div></section>`);

  const deck = document.getElementById("deck");
  deck.innerHTML = slides.join("");
  const all = [...deck.querySelectorAll(".slide")];
  // start the band-photo pan in the middle
  const pan = document.getElementById("pan"), panImg = pan.querySelector("img");
  const center = () => { pan.scrollLeft = (pan.scrollWidth - pan.clientWidth) / 2; };
  panImg.complete ? center() : panImg.addEventListener("load", center);

  /* contents: label every slide so we can show where you are and jump anywhere */
  const GROUP = { cover: "Cover", band: "The Band", overview: "Program", piece: "Program", secview: "Meet the Musicians", director: "Directors", staff: "Lesson Staff", about: "Our Program", thanks: "Thank You", finale: "Thank You" };
  const meta = all.map(sl => {
    const type = Object.keys(GROUP).find(k => sl.classList.contains(k)) || "";
    const h2 = sl.querySelector("h2");
    return { type, group: GROUP[type] || "", label: ["piece", "secview", "director"].includes(type) && h2 ? h2.textContent : "", color: sl.style.getPropertyValue("--c") };
  });
  let cur = 0;
  const go = i => { all[i].scrollIntoView({ behavior: "instant", block: "start" }); sync(); };
  const idx = t => meta.map((m, i) => m.type === t ? i : -1).filter(i => i >= 0);
  const first = t => idx(t)[0];
  const top = (i, label) => `<li><button class="top" data-goto="${i}">${label}</button></li>`;
  const child = (i, inner) => `<li><button class="child" data-goto="${i}">${inner}</button></li>`;
  const menu = document.getElementById("menu"), menuBtn = document.getElementById("menuBtn");
  document.getElementById("menuIn").innerHTML = `
    <div class="brand">Walsh <i>Honor</i> Band</div><div class="sub">Midwest Clinic · Dec 2026</div>
    <ul>
      ${top(first("cover"), "Cover")}
      ${top(first("band"), "The Band")}
      ${top(first("overview"), "Program")}
      ${idx("piece").map((i, k) => child(i, `<span class="no">${nn(k)}</span>${e(meta[i].label)}`)).join("")}
      ${top(first("secview"), "Meet the Musicians")}
      ${idx("secview").map(i => child(i, `<span class="dot" style="background:${meta[i].color}"></span>${e(meta[i].label)}`)).join("")}
      ${top(first("director"), "Faculty")}
      ${idx("director").map(i => child(i, e(meta[i].label))).join("")}
      ${child(first("staff"), "Private Lesson Staff")}
      ${top(first("about"), "Our Program")}
      ${top(first("thanks"), "Thank You")}
    </ul>`;
  const menuItems = [...menu.querySelectorAll("[data-goto]")];
  function markMenu() {
    // highlight the most specific entry at or before the current slide
    let best = null;
    menuItems.forEach(b => { if (+b.dataset.goto <= cur && (!best || +b.dataset.goto >= +best.dataset.goto)) best = b; });
    menuItems.forEach(b => b.classList.toggle("cur", b === best));
  }
  function setMenu(on) {
    sync(); markMenu();
    document.body.classList.toggle("menu-open", on);
    menuBtn.setAttribute("aria-expanded", on);
    menuBtn.setAttribute("aria-label", on ? "Close contents" : "Open contents");
    menuBtn.querySelector("path").setAttribute("d", on ? "M3.5 3.5l9 9M12.5 3.5l-9 9" : "M2.5 4h11M2.5 8h11M2.5 12h11");
    if (on) { const c = menu.querySelector(".cur"); if (c) menu.scrollTop = c.offsetTop - innerHeight / 3; }
  }
  menuBtn.addEventListener("click", () => setMenu(!document.body.classList.contains("menu-open")));
  document.getElementById("scrim").addEventListener("click", () => setMenu(false));

  /* progress + chip */
  const prog = document.getElementById("prog");
  prog.innerHTML = all.map(() => "<i></i>").join("");
  const dots = [...prog.children];
  // which slide is on screen: the last one whose top has passed the middle of the viewport
  function sync() {
    const mid = innerHeight / 2;
    let i = 0;
    all.forEach((sl, j) => { if (sl.getBoundingClientRect().top <= mid) i = j; });
    if (i === cur && sync.ran) return;
    cur = i; sync.ran = true;
    dots.forEach((d, j) => d.classList.toggle("on", j === i));
  }
  let ticking = false;
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; sync(); }); } }, { passive: true });
  sync();

  /* overlay */
  const ov = document.getElementById("ov"), ovc = document.getElementById("ovc");
  const open = (html, color) => { ov.style.setProperty("--c1", color || "#0d1f16"); ovc.innerHTML = html; ov.scrollTop = 0; ov.classList.add("on"); document.body.classList.add("lock"); };
  const close = () => { ov.classList.remove("on"); document.body.classList.remove("lock"); };
  document.getElementById("x").onclick = close;
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") { close(); setMenu(false); } });

  document.addEventListener("click", ev => {
    const g = ev.target.closest("[data-goto]");
    if (g) { setMenu(false); go(+g.dataset.goto); return; }
    const p = ev.target.closest("[data-piece]");
    if (p) {
      const i = +p.dataset.piece, pc = P.pieces[i];
      return open(`<div class="head"><div class="k" style="color:#fff;opacity:.75">No. ${nn(i)}</div><h2>${e(pc.title)}</h2><div>${e(pc.composer)}</div></div>
        <div class="body">
          <h4>The music ${pc.placeholder ? '<span class="ph">draft</span>' : ""}</h4><p>${e(pc.description)}</p>
          <h4>The composer</h4><div class="comp"><img alt="" src="${PH.photoFor({ name: pc.composer, photo: pc.composerPhoto }, PAL)}"><b>${e(pc.composer)}</b></div><p>${e(pc.composerBio)}</p>
          <h4>Why we play it</h4><blockquote>${e(pc.why)}</blockquote>
        </div>`, COLORS[i % COLORS.length][0]);
    }
    const d = ev.target.closest("[data-director]");
    if (d) {
      const x = P.directors[+d.dataset.director];
      return open(`<div class="head"><div class="k">${e(x.role)}</div><h2>${e(x.name)}</h2><div style="opacity:.75">${e(x.teaches || "")}</div></div>
        <div class="body"><img class="pimg" alt="" src="${PH.photoFor(x, PAL)}"><h4>Biography</h4>${U.paras(x.bio)}</div>`);
    }
    const s = ev.target.closest("[data-student]");
    if (s) {
      const st = U.student(s.dataset.student, s.dataset.inst);
      return open(`<div class="head"><div class="k">${e(st.instrument)}</div><h2>${e(st.name)}</h2></div>
        <div class="body"><img class="pimg" alt="" src="${PH.photoFor(st, PAL)}"><h4>In their words</h4><blockquote>${e(st.quote)}</blockquote></div>`, U.color(st.instrument));
    }
    const sf = ev.target.closest("[data-staff]");
    if (sf) {
      const t = U.staff(P.lessonStaff[+sf.dataset.staff]);
      return open(`<div class="head"><div class="k">${e(t.role)}</div><h2>${e(t.name)}</h2></div>
        <div class="body"><img class="pimg" alt="" src="${PH.photoFor(t, PAL)}"><h4>Biography</h4>${U.paras(t.bio)}<a class="biolink" href="${e(t.link)}">${e(t.linkLabel)} ↗</a>${t.linkPlaceholder ? ' <span class="ph">mock link</span>' : ""}</div>`);
    }
  });
})();
</script>
</body>
</html>
