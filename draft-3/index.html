<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walsh Honor Band — Midwest Program</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --ink: #0f1f16; --muted: #5d6b62; --line: #e4e7e2; --tint: #f3f6f1;
    --green: #163825; --green-2: #204a30; --gold: #e0a400; --gold-ink: #8a6400;
    --serif: "Fraunces", Georgia, serif; --sans: "DM Sans", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }
  .ph { font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: #fff1c2; color: var(--gold-ink); padding: 2px 6px; border-radius: 3px; vertical-align: middle; }

  /* Masthead */
  .mast { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .mast .wrap { display: flex; align-items: center; justify-content: space-between; height: 54px; padding-left: 50px; }
  .mast a.logo { text-decoration: none; font-family: var(--serif); font-weight: 800; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
  .mast nav { gap: 12px !important; }
  .mast a.logo span { color: var(--gold); }
  .mast nav { display: flex; gap: 16px; font-size: 13px; font-weight: 500; }
  .mast nav a { text-decoration: none; color: var(--muted); }
  .mast nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }

  .view { animation: in .35s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }

  /* Cover */
  .cover { padding: 28px 0 8px; }
  .issue { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 8px 0; }
  .cover h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(50px, 15vw, 88px); line-height: .9; letter-spacing: -.035em; margin: 22px 0 0; }
  .cover h1 em { font-weight: 400; color: var(--green-2); }
  .dek { font-family: var(--serif); font-size: 21px; line-height: 1.35; color: var(--muted); margin: 16px 0 0; }
  .cover-img { margin: 22px -20px 0; position: relative; }
  .cover-img img { width: 100%; height: auto; }
  .cover-img .tag { display: inline-block; margin: 10px 20px 0; background: var(--gold); color: #1a1300; font-weight: 700; font-size: 12px; padding: 6px 10px; letter-spacing: .04em; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-top: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .meta small { display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .meta span { font-family: var(--serif); font-size: 17px; font-weight: 600; }

  .kick { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); }
  h2.sec { font-family: var(--serif); font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; margin: 6px 0 18px; }
  .block { padding: 48px 0 0; }

  .letter p:first-of-type::first-letter { font-family: var(--serif); float: left; font-size: 64px; line-height: .8; padding: 6px 8px 0 0; color: var(--green); font-weight: 800; }
  .letter p { font-size: 17px; }
  .letter .sig { font-family: var(--serif); font-style: italic; color: var(--muted); }

  /* Program list */
  .toc { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--ink); }
  .toc a { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .toc .no { font-family: var(--serif); font-style: italic; color: var(--gold-ink); font-size: 17px; }
  .toc .t { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
  .toc .c { display: block; font-family: var(--sans); font-size: 13.5px; color: var(--muted); margin-top: 4px; font-weight: 400; letter-spacing: 0; }
  .toc .arr { color: var(--muted); font-size: 18px; transition: transform .2s; }
  .toc a:hover .arr { transform: translateX(3px); color: var(--ink); }

  /* Spread */
  .spread { margin: 0 -20px; background: var(--green); color: #fff; padding: 28px 20px 30px; }
  .spread img { width: 100%; height: auto; }
  .spread .cap { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; opacity: .8; margin-top: 10px; }
  .spread h3 { font-family: var(--serif); font-size: 30px; font-weight: 600; margin: 0 0 16px; line-height: 1.05; }
  .spread h3 em { color: var(--gold); }
  .btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; background: var(--gold); color: #1a1300; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 18px; border-radius: 999px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

  /* Mosaic teaser */
  .mosaic { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-top: 18px; }
  .mosaic img { width: 100%; aspect-ratio: 1; object-fit: cover; }

  /* Directors feature */
  .feature { padding: 28px 0; border-bottom: 1px solid var(--line); }
  .feature .top { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: end; }
  .feature img { width: 112px; height: 140px; object-fit: cover; object-position: 50% 18%; }
  .feature h3 { font-family: var(--serif); font-size: 28px; font-weight: 800; line-height: 1; margin: 0; letter-spacing: -.02em; }
  .feature .role { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); margin-top: 8px; }
  .feature .teach { font-size: 13px; color: var(--muted); }
  .pull { font-family: var(--serif); font-size: 22px; font-style: italic; line-height: 1.3; margin: 18px 0 0; padding-left: 16px; border-left: 3px solid var(--gold); }
  .feature .bio { font-size: 15.5px; margin-top: 12px; position: relative; max-height: 7.8em; overflow: hidden; transition: max-height .4s; }
  .feature .bio::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3em; background: linear-gradient(transparent, #fff); }
  .feature.full .bio { max-height: 200em; }
  .feature.full .bio::after { display: none; }
  .linkbtn { font: inherit; font-size: 14px; font-weight: 700; background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--green); text-decoration: underline; text-underline-offset: 3px; }

  .staff { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }
  .staff img { width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: 50% 20%; filter: grayscale(1) contrast(1.05); transition: filter .3s; }
  .staff button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .staff button:hover img { filter: none; }
  .prof .bio { font-size: 15.5px; margin-top: 14px; }
  .prof .biolink { font-weight: 700; color: var(--green); }
  .staff b { display: block; font-size: 13px; line-height: 1.2; margin-top: 6px; }
  .staff small { font-size: 11.5px; color: var(--muted); }

  .admin { margin-top: 30px; font-size: 14px; color: var(--muted); }
  .admin b { color: var(--ink); }

  .end { margin-top: 56px; background: var(--tint); padding: 40px 0 56px; }
  .motto { font-family: var(--serif); font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -.02em; margin: 22px 0; }
  .motto em { color: var(--green-2); font-weight: 400; }
  footer.colophon { font-size: 12px; color: var(--muted); padding: 22px 0 40px; border-top: 1px solid var(--line); margin-top: 32px; }

  /* Article (piece) */
  .art-hero { position: relative; margin: 0 -20px; }
  .art-hero img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: 50% 25%; }
  .art-hero .num { position: absolute; right: 16px; bottom: -32px; font-family: var(--serif); font-weight: 800; font-size: 110px; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 #fff; }
  .crumb { display: inline-block; margin: 18px 0 0; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--muted); }
  .art h1 { font-family: var(--serif); font-size: clamp(40px, 11vw, 60px); line-height: .95; letter-spacing: -.03em; font-weight: 800; margin: 26px 0 8px; }
  .art .by { font-size: 15px; color: var(--muted); }
  .art .by b { color: var(--ink); }
  .art h4 { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); margin: 32px 0 8px; }
  .art p { font-size: 17.5px; margin: 0 0 12px; }
  .art .lede { font-family: var(--serif); font-size: 22px; line-height: 1.4; }
  .why { background: var(--green); color: #fff; padding: 24px 20px; margin: 30px -20px 0; }
  .why h4 { color: var(--gold); margin-top: 0; }
  .why p { font-family: var(--serif); font-size: 23px; line-height: 1.3; font-style: italic; margin: 0; }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 36px; }
  .pager a { background: #fff; padding: 16px 4px; text-decoration: none; }
  .pager a:last-child { text-align: right; }
  .pager small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
  .pager span { font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.15; }

  /* Performers */
  .chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 10px; scrollbar-width: none; position: sticky; top: 54px; background: #fff; z-index: 5; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .chips button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid-h { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .grid-h small { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 500; }
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; align-items: start; }
  .pgrid button { font: inherit; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
  .pgrid img { width: 100%; aspect-ratio: 4/5; object-fit: cover; }
  /* tie & sash colors */
  .sash { height: 5px; }
  .cover-img .sash { margin-top: 0; }
  .spread .candid { margin-top: 22px; }
  .chips button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .chips button.on .dot { box-shadow: 0 0 0 1.5px #fff; }
  .grid-h { border-bottom: 2px solid var(--c); padding-bottom: 6px; }
  .pgrid img { border-bottom: 3px solid var(--c); }
  .secfig { margin: 34px -20px 0; }
  .secfig img { width: 100%; height: auto; display: block; }
  .secfig figcaption { padding: 10px 20px 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
  .secfig figcaption b { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--ink); margin-right: 4px; }
  .prof .role.tie { color: var(--c); display: flex; align-items: center; gap: 8px; }
  .prof .role.tie::before { content: ""; width: 18px; height: 3px; background: var(--c); }
  .pgrid b { display: block; font-size: 13px; line-height: 1.2; margin-top: 6px; font-weight: 600; }

  dialog { border: 0; padding: 0; width: min(100vw, 480px); max-width: 100vw; max-height: 100svh; margin: auto auto 0; background: #fff; color: var(--ink); }
  dialog::backdrop { background: rgba(15,31,22,.6); }
  .prof img { width: 100%; aspect-ratio: 1; object-fit: cover; }
  .prof .in { padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); }
  .prof h3 { font-family: var(--serif); font-size: 32px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
  .prof .role { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); margin-top: 6px; }
  .prof .pull { font-size: 20px; }
  .prof .close { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); font-size: 20px; cursor: pointer; }
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <a class="logo" href="#/">Walsh<span>.</span>Midwest</a>
  <nav><a href="#/" data-r="home">Program</a><a href="#/performers" data-r="performers">Performers</a><a href="#/people" data-r="people">Faculty</a></nav>
</div></header>
<main class="wrap" id="app"></main>
<dialog id="dlg"></dialog>

<script src="../shared/program-data.js"></script>
<script src="../shared/placeholders.js"></script>
<script src="../shared/review-nav.js"></script>
<script>
(() => {
  const P = window.PROGRAM, U = window.PROGRAM_UTIL, e = U.esc, c = P.concert;
  const PAL = { bg1: "#e9eee6", bg2: "#c9d3c5", fg: "#163825", body: "#8fa196" };
  const nn = i => String(i + 1).padStart(2, "0");
  const ph = f => f ? ' <span class="ph">draft copy</span>' : "";
  const students = U.allStudents();
  const app = document.getElementById("app");

  const home = () => `
    <section class="cover">
      <div class="issue"><span>${e(c.event.replace("The ", ""))}</span><span>Dec 2026</span></div>
      <h1>Walsh <em>Honor</em> Band</h1>
      <p class="dek">${students.length} middle school musicians from Round Rock, Texas, take the stage at the world's largest band and orchestra conference.</p>
      <figure class="cover-img"><img alt="${e(P.bandPhoto.caption)}" src="${PH.band({ sky1: "#2c5a3e", sky2: "#0d2115" })}"><div class="sash" style="background:${U.stripe()}" aria-hidden="true"></div><span class="tag">Conducted by ${e(c.conductor)}</span></figure>
      <div class="meta">
        <div><small>Date</small><span>${e(c.date)}</span></div>
        <div><small>Time</small><span>${e(c.time)}</span></div>
        <div><small>Venue</small><span>${e(c.venue)}, ${e(c.room)}</span></div>
        <div><small>City</small><span>${e(c.city)}</span></div>
      </div>
    </section>

    <section class="block letter">
      <div class="kick">Editor's letter</div>
      <h2 class="sec">${e(P.welcome.heading)}</h2>
      <p>${e(P.welcome.body)}</p>
      <p class="sig">— ${e(P.welcome.signedBy)}</p>
    </section>

    <section class="block">
      <div class="kick">In this program</div>
      <h2 class="sec">The Program</h2>
      <ol class="toc">${P.pieces.map((p, i) => `
        <li><a href="#/piece/${i + 1}"><span class="no">${nn(i)}</span><span class="t">${e(p.title)}<span class="c">${e(p.composer)}${p.duration ? " · " + e(p.duration) : ""}</span></span><span class="arr">→</span></a></li>`).join("")}
      </ol>
    </section>

    <section class="block">
      <div class="spread">
        <div class="kick" style="color:var(--gold)">The ensemble</div>
        <h3>${students.length} musicians. <em>One sound.</em></h3>
        <img alt="${e(P.bandPhoto.caption)}" src="${PH.band()}">
        <div class="cap"><span>${e(P.bandPhoto.caption)}</span><span>Photo: [credit]</span></div>
        <img class="candid" alt="${e(P.bandPhotoCandid.caption)}" loading="lazy" src="${PH.candid()}">
        <div class="cap"><span>${e(P.bandPhotoCandid.caption)}</span></div>
        <a class="btn" href="#/performers">Meet the performers →</a>
      </div>
      <div class="mosaic">${students.filter((_, i) => i % 4 === 1).slice(0, 16).map(s => `<img alt="" loading="lazy" src="${PH.photoFor(s, PAL, { fontSize: 46, initialsY: 104 })}">`).join("")}</div>
    </section>

    ${peopleBlock()}

    <section class="end"><div>
      <div class="kick">Acknowledgments</div>
      <p style="font-size:17px">${e(P.thanks)}</p>
      <p class="motto">The way we do <em>anything</em> is the way we do <em>everything.</em></p>
    </div></section>
    <footer class="colophon">${e(c.ensemble)} · ${e(c.district)} · <a href="${e(c.siteUrl)}">walshband.com</a></footer>`;

  function peopleBlock() {
    return `
    <section class="block" id="people">
      <div class="kick">The people behind the music</div>
      <h2 class="sec">Directors</h2>
      ${P.directors.map((d, i) => `
        <article class="feature" id="d${i}">
          <div class="top"><img alt="${e(d.name)}" src="${PH.photoFor(d, PAL)}"><div><h3>${e(d.name)}</h3><div class="role">${e(d.role)}</div><div class="teach">${e(d.teaches || "")}</div></div></div>
          <p class="pull">“${e(d.quote)}”</p>
          <div class="bio">${U.paras(d.bio)}</div>
          <button class="linkbtn" data-expand="d${i}">Continue reading</button>
        </article>`).join("")}
    </section>
    <section class="block">
      <div class="kick">With gratitude</div>
      <h2 class="sec">Private Lesson Staff</h2>
      <p style="color:var(--muted);margin-top:-6px">${e(P.lessonStaffIntro)}</p>
      <div class="staff">${P.lessonStaff.map((t, i) => `<button data-staff="${i}"><img alt="" loading="lazy" src="${PH.photoFor(t, PAL)}"><b>${e(t.name)}</b><small>${e(t.instrument)}</small></button>`).join("")}</div>
      <div class="admin"><div class="kick" style="margin-bottom:6px">Administration</div>${P.administration.map(a => `<div><b>${e(a.name)}</b> — ${e(a.role)}</div>`).join("")}</div>
    </section>`;
  }

  const piece = n => {
    const i = Math.max(0, Math.min(P.pieces.length - 1, n - 1)), p = P.pieces[i];
    const prev = P.pieces[i - 1], next = P.pieces[i + 1];
    return `
    <article class="art">
      <a class="crumb" href="#/">← The Program</a>
      <figure class="art-hero" style="margin-top:14px"><img alt="${e(p.composer)}" src="${PH.photoFor({ name: p.composer, photo: p.composerPhoto }, PAL, { fontSize: 30 })}"><span class="num">${nn(i)}</span></figure>
      <h1>${e(p.title)}</h1>
      <div class="by">by <b>${e(p.composer)}</b>${p.duration ? " · " + e(p.duration) : ""}</div>
      <h4>About the music${ph(p.placeholder)}</h4>
      <p class="lede">${e(p.description)}</p>
      <h4>About the composer</h4>
      <p>${e(p.composerBio)}</p>
      <div class="why"><h4>Why we play it</h4><p>“${e(p.why)}”</p></div>
      <nav class="pager">
        ${prev ? `<a href="#/piece/${i}"><small>← Previous</small><span>${e(prev.title)}</span></a>` : `<a href="#/"><small>←</small><span>Program</span></a>`}
        ${next ? `<a href="#/piece/${i + 2}"><small>Next →</small><span>${e(next.title)}</span></a>` : `<a href="#/performers"><small>Next →</small><span>The Performers</span></a>`}
      </nav>
    </article>`;
  };

  let filter = "All";
  const performers = () => {
    const secs = P.sections.filter(s => filter === "All" || s.instrument === filter);
    return `
    <section class="block" style="padding-top:28px">
      <div class="kick">${e(c.ensemble)}</div>
      <h2 class="sec">The Performers</h2>
      <div class="chips">${["All", ...P.sections.map(s => s.instrument)].map(x => `<button data-filter="${e(x)}" class="${x === filter ? "on" : ""}">${x === "All" ? "" : `<span class="dot" style="background:${U.color(x)}"></span>`}${e(x)}</button>`).join("")}</div>
      ${secs.map(s => { const g = U.sectionPhotoStart(s.instrument) || (filter !== "All" && U.sectionPhoto(s.instrument)); return `
        ${g ? `<figure class="secfig"><img alt="${e(g.title)} section photo" loading="lazy" src="${PH.section(g)}"><figcaption><b>${e(g.title)}.</b> ${e(U.rowsText(g))}</figcaption></figure>` : ""}
        <div style="--c:${U.color(s.instrument)}"><div class="grid-h">${e(s.instrument)}</div>
        <div class="pgrid">${s.players.map(n => `<button data-student="${e(n)}" data-inst="${e(s.instrument)}"><img alt="" loading="lazy" src="${PH.photoFor({ name: n, photo: (P.students[n] || {}).photo }, PAL)}"><b>${e(n)}</b></button>`).join("")}</div></div>`; }).join("")}
    </section>`;
  };

  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    let r = "home";
    if (h.startsWith("piece/")) { app.innerHTML = `<div class="view">${piece(+h.split("/")[1])}</div>`; r = "home"; }
    else if (h === "performers") { app.innerHTML = `<div class="view">${performers()}</div>`; r = "performers"; }
    else if (h === "people") { app.innerHTML = `<div class="view">${peopleBlock()}</div>`; r = "people"; }
    else app.innerHTML = `<div class="view">${home()}</div>`;
    document.querySelectorAll(".mast nav a").forEach(a => a.classList.toggle("on", a.dataset.r === r));
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();

  const dlg = document.getElementById("dlg");
  document.addEventListener("click", ev => {
    const f = ev.target.closest("[data-filter]"); if (f) { filter = f.dataset.filter; const y = scrollY; app.innerHTML = `<div>${performers()}</div>`; scrollTo(0, Math.min(y, 120)); return; }
    const x = ev.target.closest("[data-expand]"); if (x) { const a = document.getElementById(x.dataset.expand); a.classList.toggle("full"); x.textContent = a.classList.contains("full") ? "Show less" : "Continue reading"; return; }
    const s = ev.target.closest("[data-student]");
    if (s) {
      const st = U.student(s.dataset.student, s.dataset.inst);
      dlg.innerHTML = `<div class="prof" style="--c:${U.color(st.instrument)}"><button class="close" aria-label="Close">×</button><img alt="" src="${PH.photoFor(st, PAL)}"><div class="sash" style="background:var(--c)"></div><div class="in"><h3>${e(st.name)}</h3><div class="role tie">${e(st.instrument)}${st.grade ? " · Grade " + st.grade : ""}</div><p class="pull">“${e(st.quote)}”</p></div></div>`;
      dlg.showModal(); return;
    }
    const sf = ev.target.closest("[data-staff]");
    if (sf) {
      const t = U.staff(P.lessonStaff[+sf.dataset.staff]);
      dlg.innerHTML = `<div class="prof"><button class="close" aria-label="Close">×</button><img alt="" style="object-position:50% 20%" src="${PH.photoFor(t, PAL)}"><div class="in"><h3>${e(t.name)}</h3><div class="role">${e(t.role)}</div><div class="bio">${U.paras(t.bio)}</div><a class="biolink" href="${e(t.link)}">${e(t.linkLabel)} →</a>${t.linkPlaceholder ? ' <span class="ph">mock link</span>' : ""}</div></div>`;
      dlg.showModal(); return;
    }
    if (ev.target.closest(".close") || ev.target === dlg) dlg.close();
  });
})();
</script>
</body>
</html>
